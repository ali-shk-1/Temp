<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0f172a; color:#e2e8f0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .spinner { width:36px; height:36px; border-radius:50%; border:3px solid #334155; border-top-color:#4f46e5;
    animation:spin .8s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { font-size:14px; color:#94a3b8; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Waiting for local server to start…</p>
</body>
</html>
